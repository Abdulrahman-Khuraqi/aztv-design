<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -110 1025 960" width="1025" height="960" role="img" aria-label="AZ TV">
  <title>AZ TV | عز تي في</title>
  <!-- Animated store logo, SHINE version: always visible (no intro) and always alive.
       A bright shine sweeps across every 3 s, the logo floats gently, a gold glow breathes behind it, small sparkles twinkle.
       All CSS inside the file, so it also runs as a plain image / uploaded store logo. Still for reduced motion. -->
  <defs>
    <linearGradient id="az-gold" x1="0" y1="0" x2="885" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6E08A"/><stop offset=".5" stop-color="#ECD169"/><stop offset="1" stop-color="#C9A443"/>
    </linearGradient>
    <linearGradient id="az-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".3" stop-color="#FFF4C8" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="1"/><stop offset=".7" stop-color="#FFF4C8" stop-opacity=".45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="az-shapes"><path d="M546 6 396 209 266 159 366 215 363 217 335 221 182 249 146 254 124 259 118 259 6 279 93 783 831 655 209 693 188 693 171 695 159 695 157 693 95 334 99 331 107 330 128 323 154 317 193 305 237 294 251 289 335 267 389 251 431 190 498 80Z"/><path d="M766 147 522 190 446 202 439 207 414 244Z"/><path d="M310 338 209 610 202 633 250 628 256 626 302 501 311 480 321 450 323 448 329 454 398 558 401 558 431 510 427 502 317 346Z"/><path d="M638 298 335 334 367 380 399 377 462 368 523 362 539 359 544 360 398 604 396 610 515 595 558 591 598 585 659 579 673 576 668 528 547 541 539 543 529 543 495 548 490 547Z"/><path d="M878 269 871 271 862 271 857 273 832 340 828 338 789 280 670 294 671 311 675 313 708 308 715 308 717 310 724 375 728 397 745 394 738 324 735 306 740 304 780 300 836 382Z"/></clipPath>
    <filter id="az-blur" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <style>
    #float { animation: az-float 4.5s ease-in-out infinite; transform-box: view-box; transform-origin: 442.5px 395.0px; }
    #glow { opacity: .3; animation: az-breathe 3s ease-in-out infinite; }
    #shine { transform: translateX(-420px) skewX(-18deg); animation: az-shine 3s cubic-bezier(.45, 0, .2, 1) .4s infinite; }
    .spark { fill: #FFF6D6; opacity: 0; transform-box: fill-box; transform-origin: center; animation: az-spark 3.6s ease-in-out infinite; }
    @keyframes az-float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(-1.5deg); } }
    @keyframes az-breathe { 0%, 100% { opacity: .3; } 50% { opacity: .75; } }
    @keyframes az-shine { 0% { transform: translateX(-420px) skewX(-18deg); } 55% { transform: translateX(1005px) skewX(-18deg); } 100% { transform: translateX(1005px) skewX(-18deg); } }
    @keyframes az-spark { 0%, 70%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 80% { opacity: 1; transform: scale(1) rotate(45deg); } 90% { opacity: 0; transform: scale(.3) rotate(90deg); } }
    @media (prefers-reduced-motion: reduce) {
      #float, #glow, #shine, .spark { animation: none; }
      #shine, .spark { display: none; }
    }
  </style>
  <g id="float">
    <g id="glow" filter="url(#az-blur)" fill="#EACF69"><path d="M546 6 396 209 266 159 366 215 363 217 335 221 182 249 146 254 124 259 118 259 6 279 93 783 831 655 209 693 188 693 171 695 159 695 157 693 95 334 99 331 107 330 128 323 154 317 193 305 237 294 251 289 335 267 389 251 431 190 498 80Z"/><path d="M766 147 522 190 446 202 439 207 414 244Z"/><path d="M310 338 209 610 202 633 250 628 256 626 302 501 311 480 321 450 323 448 329 454 398 558 401 558 431 510 427 502 317 346Z"/><path d="M638 298 335 334 367 380 399 377 462 368 523 362 539 359 544 360 398 604 396 610 515 595 558 591 598 585 659 579 673 576 668 528 547 541 539 543 529 543 495 548 490 547Z"/><path d="M878 269 871 271 862 271 857 273 832 340 828 338 789 280 670 294 671 311 675 313 708 308 715 308 717 310 724 375 728 397 745 394 738 324 735 306 740 304 780 300 836 382Z"/></g>
    <g fill="url(#az-gold)"><path d="M546 6 396 209 266 159 366 215 363 217 335 221 182 249 146 254 124 259 118 259 6 279 93 783 831 655 209 693 188 693 171 695 159 695 157 693 95 334 99 331 107 330 128 323 154 317 193 305 237 294 251 289 335 267 389 251 431 190 498 80Z"/><path d="M766 147 522 190 446 202 439 207 414 244Z"/><path d="M310 338 209 610 202 633 250 628 256 626 302 501 311 480 321 450 323 448 329 454 398 558 401 558 431 510 427 502 317 346Z"/><path d="M638 298 335 334 367 380 399 377 462 368 523 362 539 359 544 360 398 604 396 610 515 595 558 591 598 585 659 579 673 576 668 528 547 541 539 543 529 543 495 548 490 547Z"/><path d="M878 269 871 271 862 271 857 273 832 340 828 338 789 280 670 294 671 311 675 313 708 308 715 308 717 310 724 375 728 397 745 394 738 324 735 306 740 304 780 300 836 382Z"/></g>
    <g clip-path="url(#az-shapes)"><rect id="shine" x="0" y="-60" width="420" height="910" fill="url(#az-shine)"/></g>
    <path class="spark" style="animation-delay:0s" d="M546 -82Q565.36 -13.36 634 6Q565.36 25.36 546 94Q526.64 25.36 458 6Q526.64 -13.36 546 -82Z"/><path class="spark" style="animation-delay:1.1s" d="M870 198Q884.08 247.92 934 262Q884.08 276.08 870 326Q855.92 276.08 806 262Q855.92 247.92 870 198Z"/><path class="spark" style="animation-delay:2.2s" d="M150 502Q162.76 547.24 208 560Q162.76 572.76 150 618Q137.24 572.76 92 560Q137.24 547.24 150 502Z"/><path class="spark" style="animation-delay:3.0s" d="M760 650Q771.0 689.0 810 700Q771.0 711.0 760 750Q749.0 711.0 710 700Q749.0 689.0 760 650Z"/>
  </g>
</svg>
