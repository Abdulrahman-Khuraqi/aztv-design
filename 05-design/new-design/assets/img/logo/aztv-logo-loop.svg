<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -150 885 940" width="885" height="940" role="img" aria-label="AZ TV">
  <title>AZ TV | عز تي في</title>
  <!-- Animated store logo, LOOP version. The same intro as aztv-logo-animated.svg (frame draws in, A and Z rise, TV pops),
       then it keeps moving quietly: signal waves rise from the antenna tip, a soft gold glow breathes behind the logo,
       and a light shine passes across it every 7 s. All CSS inside the file, so it runs as a plain image. No motion with reduced motion. -->
  <defs>
    <linearGradient id="az-gold" x1="0" y1="0" x2="885" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2DA7A"/><stop offset=".55" stop-color="#ECD169"/><stop offset="1" stop-color="#CFAE4C"/>
    </linearGradient>
    <linearGradient id="az-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0"/><stop offset=".5" stop-color="#FFF6D6" stop-opacity=".8"/><stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="az-shapes"><path d="M546 6 396 209 266 159 366 215 363 217 335 221 182 249 146 254 124 259 118 259 6 279 93 783 831 655 209 693 188 693 171 695 159 695 157 693 95 334 99 331 107 330 128 323 154 317 193 305 237 294 251 289 335 267 389 251 431 190 498 80Z"/><path d="M766 147 522 190 446 202 439 207 414 244Z"/><path d="M310 338 209 610 202 633 250 628 256 626 302 501 311 480 321 450 323 448 329 454 398 558 401 558 431 510 427 502 317 346Z"/><path d="M638 298 335 334 367 380 399 377 462 368 523 362 539 359 544 360 398 604 396 610 515 595 558 591 598 585 659 579 673 576 668 528 547 541 539 543 529 543 495 548 490 547Z"/><path d="M878 269 871 271 862 271 857 273 832 340 828 338 789 280 670 294 671 311 675 313 708 308 715 308 717 310 724 375 728 397 745 394 738 324 735 306 740 304 780 300 836 382Z"/></clipPath>
    <filter id="az-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <style>
    /* intro, once */
    .draw { stroke: #ECD169; stroke-width: 6; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; fill-opacity: 0;
             animation: az-draw 1.1s cubic-bezier(.6, 0, .3, 1) forwards, az-fill .5s ease-out .85s forwards; }
    #line { animation-delay: .25s, 1s; }
    .rise { opacity: 0; transform: translateY(70px); transform-box: fill-box; animation: az-rise .55s cubic-bezier(.2, .8, .2, 1) forwards; }
    #a { animation-delay: 1s; }
    #z { animation-delay: 1.15s; }
    #tv { opacity: 0; transform: scale(.4); transform-box: fill-box; transform-origin: center; animation: az-pop .45s cubic-bezier(.3, 1.6, .5, 1) 1.55s forwards; }
    /* loop, after the intro */
    #glow { opacity: 0; animation: az-breathe 4.8s ease-in-out 2.2s infinite; }
    .wave { fill: none; stroke: #ECD169; stroke-width: 9; stroke-linecap: round; opacity: 0;
             transform-box: view-box; transform-origin: 546px 6px; animation: az-wave 3.6s ease-out infinite; }
    .wave:nth-of-type(1) { animation-delay: 2.2s; }
    .wave:nth-of-type(2) { animation-delay: 2.8s; }
    .wave:nth-of-type(3) { animation-delay: 3.4s; }
    #shine { transform: translateX(-398px); animation: az-shine 7s ease-in-out 1.95s infinite; }
    @keyframes az-draw { to { stroke-dashoffset: 0; } }
    @keyframes az-fill { to { fill-opacity: 1; stroke-width: 0; } }
    @keyframes az-rise { to { opacity: 1; transform: none; } }
    @keyframes az-pop { to { opacity: 1; transform: none; } }
    @keyframes az-breathe { 0%, 100% { opacity: .12; } 50% { opacity: .42; } }
    @keyframes az-wave { 0% { opacity: 0; transform: scale(.35); } 15% { opacity: .85; } 70% { opacity: 0; transform: scale(1.25); } 100% { opacity: 0; transform: scale(1.25); } }
    @keyframes az-shine { 0% { transform: translateX(-398px); } 14% { transform: translateX(885px); } 100% { transform: translateX(885px); } }
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, #tv, #shine, #glow, .wave { animation: none; }
      .draw, .rise, #tv { opacity: 1; transform: none; fill-opacity: 1; stroke-width: 0; }
      #shine, .wave { display: none; }
      #glow { opacity: .2; }
    }
  </style>
  <g id="glow" filter="url(#az-blur)" fill="#EACF69">
    <path d="M546 6 396 209 266 159 366 215 363 217 335 221 182 249 146 254 124 259 118 259 6 279 93 783 831 655 209 693 188 693 171 695 159 695 157 693 95 334 99 331 107 330 128 323 154 317 193 305 237 294 251 289 335 267 389 251 431 190 498 80Z"/><path d="M766 147 522 190 446 202 439 207 414 244Z"/><path d="M310 338 209 610 202 633 250 628 256 626 302 501 311 480 321 450 323 448 329 454 398 558 401 558 431 510 427 502 317 346Z"/><path d="M638 298 335 334 367 380 399 377 462 368 523 362 539 359 544 360 398 604 396 610 515 595 558 591 598 585 659 579 673 576 668 528 547 541 539 543 529 543 495 548 490 547Z"/><path d="M878 269 871 271 862 271 857 273 832 340 828 338 789 280 670 294 671 311 675 313 708 308 715 308 717 310 724 375 728 397 745 394 738 324 735 306 740 304 780 300 836 382Z"/>
  </g>
  <g id="waves">
    <path class="wave" d="M460.0 -54.2A105 105 0 0 1 632.0 -54.2"/>
    <path class="wave" d="M460.0 -54.2A105 105 0 0 1 632.0 -54.2"/>
    <path class="wave" d="M460.0 -54.2A105 105 0 0 1 632.0 -54.2"/>
  </g>
  <g fill="url(#az-gold)">
    <path id="frame" class="draw" pathLength="1" d="M546 6 396 209 266 159 366 215 363 217 335 221 182 249 146 254 124 259 118 259 6 279 93 783 831 655 209 693 188 693 171 695 159 695 157 693 95 334 99 331 107 330 128 323 154 317 193 305 237 294 251 289 335 267 389 251 431 190 498 80Z"/>
    <path id="line" class="draw" pathLength="1" d="M766 147 522 190 446 202 439 207 414 244Z"/>
    <path id="a" class="rise" d="M310 338 209 610 202 633 250 628 256 626 302 501 311 480 321 450 323 448 329 454 398 558 401 558 431 510 427 502 317 346Z"/>
    <path id="z" class="rise" d="M638 298 335 334 367 380 399 377 462 368 523 362 539 359 544 360 398 604 396 610 515 595 558 591 598 585 659 579 673 576 668 528 547 541 539 543 529 543 495 548 490 547Z"/>
    <path id="tv" d="M878 269 871 271 862 271 857 273 832 340 828 338 789 280 670 294 671 311 675 313 708 308 715 308 717 310 724 375 728 397 745 394 738 324 735 306 740 304 780 300 836 382Z"/>
  </g>
  <g clip-path="url(#az-shapes)">
    <rect id="shine" x="0" y="0" width="398" height="790" fill="url(#az-shine)"/>
  </g>
</svg>
