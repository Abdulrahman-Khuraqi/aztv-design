<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Offer product image</title>
<!--
  «عرض الأسبوع» (offer of the week) for the regular product «عز تي في سنة + ٣ شهور» (96 SAR instead of 238, 3 months free).
  Elegant version (2026-10-25), black and white only, no gold (client): the two finished regular cards as a gift set on the dark stage:
    centre left:  the 1-year card in front, tilted -5 degrees; the 3-month card behind it to the right, tilted 8 degrees
    across both:  a black satin ribbon with thin white edges, tied in a bow where the cards overlap (the 3 months are the gift)
    top:          «OFFER OF THE WEEK» in small spaced letters between two thin lines, «عرض الأسبوع» under it
    right:        the price «96» large and white, «ريال فقط», the old price struck through, a thin line, «+ ٣ شهور مجانًا»
    seal:         a white «خصم ٦٠٪» seal on the front card's top corner
  Canvas 1000 x 1000, exported at 2x = 2000 x 2000, on the approved regular stage without a card (backgrounds.html).
  URL: ?stage=<empty stage jpg>&big=<card png>&small=<card png>  (&price=96 &old=٢٣٨ &free=٣ شهور مجانًا &save=٦٠٪)
  The stage carries the logo top centre, vertical AZTVSTORE letters (left from y 640, right up to y 460) and the contact pills at the bottom.
-->
<style>
  @font-face { font-family: "PingARLT"; src: url("../subscription-backgrounds/src/PingARLT-Bold.woff2") format("woff2"); font-weight: 700; }
  :root { --ink: #0D0D0D; --white: #F4F4F2; --grey: #A9A9A4; }
  html, body { margin: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  #stage { position: relative; width: 1000px; height: 1000px; overflow: hidden; font-family: "PingARLT", system-ui, sans-serif; color: var(--white); }
  #stage > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* soft light behind the gift set */
  .light { position: absolute; inset: 0; background: radial-gradient(circle at 440px 600px, rgba(255,255,255,.16) 0, rgba(255,255,255,.06) 200px, rgba(255,255,255,0) 360px); }

  /* heading */
  .eyebrow { position: absolute; left: 0; right: 0; top: 152px; display: flex; align-items: center; justify-content: center; gap: 18px;
    direction: ltr; font-size: 15px; letter-spacing: .42em; color: #CFCFCA; }
  .eyebrow::before, .eyebrow::after { content: ""; width: 70px; height: 1px; background: rgba(244,244,242,.55); }
  .heading { position: absolute; left: 0; right: 0; top: 176px; text-align: center; font-size: 66px; line-height: 1.25; font-weight: 700; text-shadow: 0 8px 28px rgba(0,0,0,.6); }

  /* the gift set */
  .card { position: absolute; display: block; height: auto; filter: drop-shadow(0 26px 34px rgba(0,0,0,.65)); }
  .small { left: 474px; top: 404px; width: 236px; transform: rotate(8deg); }
  .big { left: 190px; top: 334px; width: 300px; transform: rotate(-5deg); }
  .ribbon { position: absolute; left: 178px; top: 612px; width: 556px; height: 110px; overflow: visible; filter: drop-shadow(0 8px 12px rgba(0,0,0,.55)); }

  /* seal */
  .seal { position: absolute; left: 130px; top: 262px; width: 112px; height: 112px; border-radius: 50%; background: var(--white); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-12deg);
    box-shadow: 0 14px 26px rgba(0,0,0,.55); }
  .seal::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1.5px dashed rgba(13,13,13,.45); }
  .seal small { font-size: 20px; line-height: 1; }
  .seal b { font-size: 38px; line-height: 1.05; }

  /* price column */
  .col { position: absolute; left: 738px; top: 318px; width: 206px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .col .n { font-size: 158px; line-height: .92; font-weight: 700; letter-spacing: -.03em;
    background: linear-gradient(#FFFFFF 10%, #DADAD6 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,.6)); }
  .col .u { font-size: 30px; line-height: 1.2; margin-top: 6px; }
  .col .was { font-size: 20px; line-height: 1.4; color: var(--grey); }
  .col .was s { text-decoration-thickness: 2px; text-decoration-color: #D6D6D2; }
  .col .rule { width: 120px; height: 1px; background: rgba(244,244,242,.5); margin: 18px 0 16px; }
  .col .gift { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 18px; border-radius: 99px; border: 1.5px solid rgba(244,244,242,.85);
    font-size: 25px; white-space: nowrap; background: rgba(13,13,13,.55); }
  .col .gift svg { width: 24px; height: 24px; fill: none; stroke: var(--white); stroke-width: 1.8; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="stage">
  <img class="bg" id="stageBg" alt="">
  <div class="light"></div>
  <div class="eyebrow">OFFER OF THE WEEK</div>
  <div class="heading">عرض الأسبوع</div>
  <img class="card small" id="small" alt="">
  <img class="card big" id="big" alt="">
  <svg class="ribbon" viewBox="0 0 556 110" aria-hidden="true">
    <defs>
      <linearGradient id="sat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C3C3A"/><stop offset=".45" stop-color="#141413"/><stop offset="1" stop-color="#000"/></linearGradient>
      <linearGradient id="sat2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A4A47"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
    </defs>
    <!-- band across both cards, slightly tilted, with thin white edges -->
    <g transform="rotate(-2 278 40)">
      <rect x="0" y="28" width="556" height="24" fill="url(#sat)"/>
      <rect x="0" y="29.5" width="556" height="1.4" fill="#F4F4F2" opacity=".85"/>
      <rect x="0" y="49" width="556" height="1.4" fill="#F4F4F2" opacity=".85"/>
    </g>
    <!-- bow where the cards meet -->
    <g transform="translate(298 38) scale(.82)" stroke="#F4F4F2" stroke-width="1.4" stroke-linejoin="round">
      <path d="M-10 4 L-30 50 L-18 44 L-12 58 L3 10Z" fill="url(#sat2)"/>
      <path d="M10 4 L30 50 L18 44 L12 58 L-3 10Z" fill="url(#sat2)"/>
      <path d="M0 0 C-22 -42 -74 -46 -78 -12 C-82 20 -30 22 0 0Z" fill="url(#sat)"/>
      <path d="M0 0 C22 -42 74 -46 78 -12 C82 20 30 22 0 0Z" fill="url(#sat)"/>
      <path d="M-30 -14 C-46 -26 -60 -22 -64 -12" fill="none" stroke-opacity=".45"/>
      <path d="M30 -14 C46 -26 60 -22 64 -12" fill="none" stroke-opacity=".45"/>
      <rect x="-14" y="-16" width="28" height="32" rx="8" fill="url(#sat)"/>
    </g>
  </svg>
  <div class="seal"><small>خصم</small><b id="save">٦٠٪</b></div>
  <div class="col">
    <span class="n" id="price">96</span>
    <span class="u">ريال فقط</span>
    <span class="was">بدل <s id="old">٢٣٨</s> ريال</span>
    <span class="rule"></span>
    <span class="gift"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M2 9h20M12 9v12M12 9c-2-4-7-4-6 0M12 9c2-4 7-4 6 0"/></svg><span id="free">+ ٣ شهور مجانًا</span></span>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("stageBg").src = q.get("stage");
document.getElementById("big").src = q.get("big");
document.getElementById("small").src = q.get("small");
if (q.get("price")) document.getElementById("price").textContent = q.get("price");
if (q.get("old")) document.getElementById("old").textContent = q.get("old");
if (q.get("free")) document.getElementById("free").textContent = "+ " + q.get("free");
if (q.get("save")) document.getElementById("save").textContent = q.get("save");
Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })))
  .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
