<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Offer product image</title>
<!--
  «عرض الأسبوع» (offer of the week): the product image of the offer «سنة + ٣ شهور», built like the old offer image
  (03-current-site/old-design/assets/img/3749112-500x500-jALOT8PWhFqMydBaPXNuQ0Q93IRepaG523qElILR-ad8ae7f8.jpg) from the finished cards we already
  have, no new card:
    top centre:   big title banner «عرض الأسبوع» (the word «عرض» on a gold plate, «الأسبوع» in white beside it)
    left:         the 1-year card, smaller than the stage's own card area
    right, top:   the price as a big gold 3D number with «ريال فقط» under it
    right, middle: dashed coupon pill «٣ شهور مجانًا» with a dashed arrow curving down to the small card
    right, bottom: the 3-month card, smaller, with a gold gift ribbon and bow across it (the old one was green, for National Day)
  Canvas 1000 x 1000, exported at 2x = 2000 x 2000, on the approved stage without a card (backgrounds.html, option E has the old image's split).
  URL: ?stage=<empty stage jpg>&big=<card png>&small=<card png>  (&price=96 &free=٣ شهور مجانًا &w1=عرض &w2=الأسبوع)
  Stage sides carry the vertical AZTVSTORE letters (left from y 640, right up to y 460), the logo top centre and the 4K badge top right on Plus.
-->
<style>
  @font-face { font-family: "PingARLT"; src: url("../subscription-backgrounds/src/PingARLT-Bold.woff2") format("woff2"); font-weight: 700; }
  :root { --gold: #EACF69; --ink: #0D0D0D; --white: #F4F4F2; }
  html, body { margin: 0; background: #000; }
  body { display: grid; place-items: center; min-height: 100vh; }
  #stage { position: relative; width: 1000px; height: 1000px; overflow: hidden; font-family: "PingARLT", system-ui, sans-serif; color: var(--white); }
  #stage > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .card { position: absolute; display: block; height: auto; filter: drop-shadow(0 18px 28px rgba(0,0,0,.55)); }
  .big { left: 214px; top: 300px; width: 322px; }
  .small { left: 578px; top: 502px; width: 203px; }

  /* title banner: «عرض» on a gold plate (right), «الأسبوع» in white (left) */
  .title { position: absolute; left: 0; right: 0; top: 140px; height: 96px; display: flex; justify-content: center; direction: rtl; font-size: 74px; font-weight: 700; line-height: 96px; }
  .title .w1 { background: var(--gold); color: var(--ink); padding: 0 34px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0); box-shadow: 0 10px 24px rgba(0,0,0,.45); }
  .title .w2 { color: var(--white); padding: 0 30px 0 12px; text-shadow: 0 6px 20px rgba(0,0,0,.6); }

  /* price: big gold 3D number, «ريال فقط» under it */
  .price { position: absolute; left: 556px; top: 238px; width: 360px; text-align: center; }
  .price .n { display: block; font-size: 150px; line-height: 1; font-weight: 700; letter-spacing: -.02em;
    background: linear-gradient(#FFF1B0 5%, #EACF69 52%, #C9A84A 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #8A6D25) drop-shadow(0 6px 0 #6E5519) drop-shadow(0 14px 14px rgba(0,0,0,.6)); }
  .price .u { display: block; font-size: 38px; line-height: 1; font-weight: 700; margin-top: 4px; text-shadow: 0 4px 14px rgba(0,0,0,.7); }

  /* coupon pill with a stitched inner line */
  .free { position: absolute; left: 574px; top: 440px; width: 270px; height: 52px; border-radius: 12px; background: var(--gold); color: var(--ink);
    display: grid; place-items: center; font-size: 30px; font-weight: 700; box-shadow: 0 10px 20px rgba(0,0,0,.45); }
  .free::before { content: ""; position: absolute; inset: 5px; border: 2px dashed rgba(13,13,13,.55); border-radius: 8px; }
  .arrow { position: absolute; left: 780px; top: 440px; width: 130px; height: 90px; overflow: visible; }

  /* gold gift ribbon across the small card, bow left of centre (as on the old image) */
  .ribbon { position: absolute; left: 564px; top: 718px; width: 232px; height: 130px; overflow: visible; filter: drop-shadow(0 7px 10px rgba(0,0,0,.5)); }
</style>
</head>
<body>
<div id="stage">
  <img class="bg" id="stageBg" alt="">
  <div class="title"><span class="w1" id="w1">عرض</span><span class="w2" id="w2">الأسبوع</span></div>
  <img class="card big" id="big" alt="">
  <div class="price"><span class="n" id="price">96</span><span class="u">ريال فقط</span></div>
  <div class="free" id="free">٣ شهور مجانًا</div>
  <svg class="arrow" viewBox="0 0 130 90" aria-hidden="true">
    <path d="M66 28 C 122 26, 126 66, 26 66" fill="none" stroke="#EACF69" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
    <path d="M20 66 L36 55 M20 66 L37 77" fill="none" stroke="#EACF69" stroke-width="3.4" stroke-linecap="round"/>
  </svg>
  <img class="card small" id="small" alt="">
  <svg class="ribbon" viewBox="0 0 232 130" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8E59A"/><stop offset=".5" stop-color="#EACF69"/><stop offset="1" stop-color="#B8963A"/></linearGradient>
      <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8E59A"/><stop offset="1" stop-color="#C9A84A"/></linearGradient>
    </defs>
    <rect x="0" y="20" width="232" height="26" fill="url(#g)"/>
    <rect x="0" y="20" width="232" height="3" fill="#fff" opacity=".35"/>
    <rect x="0" y="43" width="232" height="3" fill="#8A6D25" opacity=".45"/>
    <g transform="translate(80 33) scale(.68)" stroke="#8A6D25" stroke-width="1.6" stroke-linejoin="round">
      <path d="M-10 4 L-30 44 L-18 38 L-12 52 L3 10Z" fill="url(#g2)"/>
      <path d="M10 4 L30 44 L18 38 L12 52 L-3 10Z" fill="url(#g2)"/>
      <path d="M0 0 C-22 -42 -74 -46 -78 -12 C-82 20 -30 22 0 0Z" fill="url(#g)"/>
      <path d="M0 0 C22 -42 74 -46 78 -12 C82 20 30 22 0 0Z" fill="url(#g)"/>
      <rect x="-15" y="-17" width="30" height="34" rx="9" fill="url(#g)"/>
    </g>
  </svg>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("stageBg").src = q.get("stage");
document.getElementById("big").src = q.get("big");
document.getElementById("small").src = q.get("small");
for (const [k, id] of [["price", "price"], ["free", "free"], ["w1", "w1"], ["w2", "w2"]]) if (q.get(k)) document.getElementById(id).textContent = q.get(k);
Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })))
  .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
