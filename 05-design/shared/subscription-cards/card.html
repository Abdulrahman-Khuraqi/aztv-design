<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Subscription card</title>
<!--
  One subscription card: the card background (bg/) plus its title, two portraits, duration and platform logos.
  Size 380 x 648 here, exported at 2x = 760 x 1296 to new/<card>.png by render-cards.cjs.
  URL: ?card=aztv-6m   (cards are defined in CARDS below)
  Photo placement: left, top, width in card px (lift brightens a dark photo; gamma below 1 opens the shadows of a dark face without
  blowing out the highlights); images are faded out at the bottom so no cut line shows.
  Tiers: the regular cards are white and black and white; plus: true switches to the gold card (the same layout in gold: black burst, gold name on the black title pill, black pills with gold text).
  Renewal cards have no photos: renew: true draws the renewal arrows in the middle instead.
-->
<style>
  @font-face { font-family: "PingARLT"; src: url("../subscription-backgrounds/src/PingARLT-Bold.woff2") format("woff2"); font-weight: 700; }
  :root { --gold: #EACF69; --ink: #0D0D0D; --white: #F4F4F2; }
  html, body { margin: 0; background: transparent; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card { position: relative; width: 380px; height: 648px; font-family: "PingARLT", system-ui, sans-serif; overflow: hidden; border-radius: 35px; }
  .card > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* portraits: full card width, from under the title to the bottom; the side tabs are redrawn on top */
  .photos { position: absolute; inset: 0; overflow: hidden; }
  /* light at the burst centre, behind the faces, so the centre of the burst reads as a glow and not as a knot */
  .glow { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 190px 300px, rgba(255,255,255,1) 0, rgba(255,255,255,.96) 46px, rgba(255,255,255,.7) 92px, rgba(255,255,255,.25) 150px, rgba(255,255,255,0) 210px); }
  /* light floor under the duration and logo pills, so they sit on a calm base and the photos fade into it */
  .floor { position: absolute; inset: auto 0 0; height: 210px; z-index: 8; pointer-events: none;
    background: linear-gradient(to top, rgba(244,244,242,1) 0, rgba(244,244,242,.94) 80px, rgba(244,244,242,.6) 140px, rgba(244,244,242,0) 210px); }
  /* package line under the title: the package name in a light chip, then SUBSCRIPTION (or RENEWAL) */
  .sub { position: absolute; left: 0; right: 0; top: 114px; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 10px;
    direction: ltr; font-weight: 700; }
  .sub > span { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 11px 0 4px; border-radius: 99px;
    background: var(--ink); color: #D6D6D2; font-size: 11px; letter-spacing: .22em; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  .sub b { display: grid; place-items: center; height: 22px; padding: 0 11px; border-radius: 99px; background: var(--white); color: var(--ink);
    font-size: 12.5px; letter-spacing: .1em; }
  .card > img.tabs { z-index: 9; clip-path: path("M0 97 H18 V262 H0 Z M362 408 H380 V572 H362 Z"); }
  .photos img { position: absolute; height: auto; filter: grayscale(1) contrast(1.15) brightness(1.02);
    -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent 97%); mask-image: linear-gradient(to bottom, #000 72%, transparent 97%); }

  .title { position: absolute; left: 38px; right: 38px; top: 50px; height: 58px; z-index: 10; display: grid; place-items: center;
    border-radius: 22px; background: var(--ink); color: var(--white); font-size: 29px; font-weight: 700; line-height: 1;
    box-shadow: 0 8px 22px rgba(0,0,0,.28); }

  .duration { position: absolute; left: 62px; right: 62px; top: 524px; height: 34px; z-index: 10; display: flex; gap: 10px; }
  .duration span { flex: 1; display: grid; place-items: center; border-radius: 99px; background: var(--ink); color: var(--white); font-weight: 700; font-size: 15px; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  .duration .en { direction: ltr; letter-spacing: .04em; }

  .logos { position: absolute; left: 34px; right: 34px; top: 568px; height: 50px; z-index: 10; border-radius: 99px; background: var(--ink);
    display: flex; align-items: center; justify-content: space-evenly; padding: 0 14px; direction: ltr; box-shadow: 0 8px 22px rgba(0,0,0,.28); }
  .logos img { display: block; width: auto; filter: brightness(0) invert(1); }
  .logos img.own-white { filter: none; }

  /* optional badge above the duration (e.g. two devices) */
  .badge { position: absolute; left: 0; right: 0; top: 482px; z-index: 10; display: flex; justify-content: center; }
  .badge span { padding: 0 18px; height: 30px; display: flex; align-items: center; gap: 5px; border-radius: 99px; background: var(--white); color: var(--ink);
    font-weight: 700; font-size: 14px; border: 2px solid var(--ink); box-shadow: 0 6px 16px rgba(0,0,0,.2); }
  .badge:empty { display: none; }
  .badge bdi { letter-spacing: .04em; }
  .badge .ico { width: 24px; height: 16px; margin-inline-end: 3px; fill: var(--ink); stroke: var(--gold); stroke-width: 1.6; }
  .badge .ico rect:last-child { fill: var(--ink); }

  /* renewal: arrows in a disc at the burst centre */
  .renew { position: absolute; left: 70px; top: 190px; width: 240px; height: 240px; z-index: 5; display: none; }
  .is-renew .renew { display: block; }
  .is-renew .glow { background: radial-gradient(circle at 190px 310px, rgba(255,255,255,1) 0, rgba(255,255,255,.9) 130px, rgba(255,255,255,.4) 175px, rgba(255,255,255,0) 230px); }
  .renew .disc { fill: var(--ink); }
  .renew .ring { fill: none; stroke: var(--white); stroke-width: 3; opacity: .9; }
  .renew .arrows { fill: none; stroke: var(--white); stroke-width: 20; stroke-linecap: round; }
  .renew .heads { fill: var(--white); }

  /* AZ TV Plus (design F, chosen by the client 2026-10-24): the AZ TV card in gold. Black and white photos on a gold card with the black
     burst running up to the top; the name in gold on a black title pill; black pills with gold text. */
  .plus .glow { background: radial-gradient(circle at 190px 300px, rgba(250,236,178,1) 0, rgba(246,228,160,.94) 46px, rgba(240,218,130,.65) 92px, rgba(234,207,105,.2) 150px, rgba(234,207,105,0) 210px); }
  .plus .floor { background: linear-gradient(to top, rgba(234,207,105,1) 0, rgba(234,207,105,.94) 80px, rgba(234,207,105,.6) 140px, rgba(234,207,105,0) 210px); }
  .plus .photos img { filter: grayscale(1) contrast(1.15) brightness(1.02); }
  .plus .title { color: var(--gold); }
  .plus .sub b { background: var(--gold); }
  .plus .duration span { color: var(--gold); }
  .plus .badge span { background: var(--ink); color: var(--gold); border-color: var(--gold); }
  .plus .badge .ico { fill: var(--gold); stroke: var(--ink); }
  .plus .badge .ico rect:last-child { fill: var(--gold); }
  .plus.is-renew .glow { background: radial-gradient(circle at 190px 310px, rgba(250,236,178,1) 0, rgba(246,228,160,.9) 130px, rgba(234,207,105,.35) 175px, rgba(234,207,105,0) 230px); }
  .plus .renew .ring { stroke: var(--gold); }
  .plus .renew .arrows { stroke: var(--gold); }
  .plus .renew .heads { fill: var(--gold); }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="bg" id="bg" alt="">
  <div class="glow"></div>
  <div class="photos" id="photos"></div>
  <svg class="renew" viewBox="-120 -120 240 240" aria-hidden="true">
    <circle class="disc" r="116"/><circle class="ring" r="104"/>
    <g class="arrows" id="arrows"></g><g class="heads" id="heads"></g>
  </svg>
  <div class="floor"></div>
  <img class="bg tabs" id="tabs" alt="">
  <div class="title" id="title"></div>
  <div class="sub"><span><b id="sub-name"></b><span id="sub"></span></span></div>
  <div class="badge" id="badge"></div>
  <div class="duration"><span class="ar" id="d-ar"></span><span class="en" id="d-en"></span></div>
  <div class="logos" id="logos"></div>
</div>
<script>
const LOGO = "../../new-design/assets/img/logos/";
// the outline beIN SPORTS logo supplied by the client (2026-10-24), shown white like the other logos, on every card
const LOGOS = [["netflix.svg", 56], ["ssc.svg", 50], ["bein-sports-outline.svg", 50], ["shahid.svg", 56]];
const PH = "photos/transparent/", ST = "stars/latest-roles/vertical/transparent/";
const REG = "bg/card-bg-aztv.png", PLUS = "bg/card-bg-aztv-plus.png";
// In every card with faces: first photo = the star (behind, right), last = the player (in front, left).
// Who is on which card follows card-stars.json where we have the photo; the rest are the closest photo we have.
const CARDS = {
  // 1. (removed by the client: there is no «سنة + ٣ شهور» card; numbers 2-10 stay as they were)
  // 2. AZ TV (regular), 6 months
  "aztv-6m": {
    bg: REG, title: "اشتراك ٦ شهور", dEn: "6 MONTHS", dAr: "٦ شهور",
    photos: [
      { src: PH + "013-blue-suit-eagle-shoulder-cape.png", left: 88, top: 133, width: 455, fadeBottom: [88, 100] },
      { src: PH + "022-bayern-red-kit-looking-up.png", left: -90, top: 69, width: 367 }
    ]
  },
  // 3. AZ TV (regular), 3 months. Accepted look (2026-10-24).
  "aztv-3m": {
    bg: REG, title: "اشتراك ٣ شهور", dEn: "3 MONTHS", dAr: "٣ شهور",
    photos: [
      { src: PH + "009-man-straw-hat-pinstripe-suit.png", left: 52, top: 26, width: 452, fadeBottom: [92, 100] },
      { src: PH + "005-man-city-sky-blue-kit.png", left: -112, top: 150, width: 470 }
    ]
  },
  // 4. AZ TV (regular), 1 month
  "aztv-1m": {
    bg: REG, title: "اشتراك شهر", dEn: "1 MONTH", dAr: "شهر",
    photos: [
      { src: PH + "015-flat-cap-long-coat-scar.png", left: 79, top: 123, width: 337 },
      { src: PH + "004-barcelona-captain.png", left: -168, top: 127, width: 483 }
    ]
  },
  // 5. AZ TV Plus, 1 year
  "plus-12m": {
    plus: true, bg: PLUS, title: "اشتراك بلس سنة", dEn: "1 YEAR", dAr: "سنة",
    // actor 018 behind (hat clears the package line; cane faded out), player 017 in front: the pairing of card 3
    photos: [
      { src: PH + "024-cowboy-hat-suit-bolo-tie-bw.png", left: -7, top: 157, width: 571, fadeBottom: [86, 100] },
      { src: PH + "023-argentina-kit-10-fists-out-bw.png", left: -118, top: 181, width: 530, fadeBottom: [80, 100] }
    ]
  },
  // 6. AZ TV Plus, 1 year, two devices
  "plus-12m-2dev": {
    plus: true, bg: PLUS, title: "اشتراك بلس سنة", dEn: "1 YEAR", dAr: "سنة", badge: ["جهازين", "2 DEVICES"],
    photos: [
      { src: PH + "002-man-black-coat.png", left: 22, top: 150, width: 360, lift: 1.06, gamma: .78, fadeBottom: [90, 100] },
      { src: PH + "006-yellow-navy-kit-captain.png", left: -110, top: 167, width: 505, lift: .9 }
    ]
  },
  // 7. AZ TV Plus, 6 months
  "plus-6m": {
    plus: true, bg: PLUS, title: "اشتراك بلس ٦ شهور", dEn: "6 MONTHS", dAr: "٦ شهور",
    // actor 014 behind (upright, light shirt against the player's dark kit; reaches the bottom, no fade), player 020 in front
    photos: [
      { src: PH + "014-bald-khaki-shirt-gloves.png", left: -53, top: 142, width: 589 },
      { src: PH + "020-barcelona-curly-hair-fist-pump.png", left: -356, top: 163, width: 789, gamma: .85 }
    ]
  },
  // 8. AZ TV Plus, 3 months
  "plus-3m": {
    plus: true, bg: PLUS, title: "اشتراك بلس ٣ شهور", dEn: "3 MONTHS", dAr: "٣ شهور",
    photos: [
      { src: PH + "016-man-tuxedo-456-badge.png", left: 72, top: 132, width: 340, lift: 1.05, gamma: .8, fadeBottom: [86, 98] },
      { src: PH + "021-real-madrid-white-kit-arms-crossed.png", left: -60, top: 138, width: 339, lift: .9 }
    ]
  },
  // AZ TV (regular), 1 year (2026-10-25): the regular line had no 12-month card; made for the offer of the week (year + 3 months free) at the
  // client's request, in the accepted look. Photos not used on any other card: actor 012 behind (left), player 003 in front (right);
  // mirrored layout because 003's raised arm leaves through the card edge.
  "aztv-12m": {
    bg: REG, title: "اشتراك سنة", dEn: "1 YEAR", dAr: "سنة",
    photos: [
      { src: PH + "012-red-blue-spider-suit.png", left: -32, top: 168, width: 395, fadeBottom: [88, 100] },
      { src: PH + "003-real-madrid-white-kit.png", left: 106, top: 150, width: 400 }
    ]
  },
  // 9. AZ TV (regular) renewal: no faces
  "renew-aztv": {
    renew: true, bg: REG, title: "تجديد الاشتراك", dEn: "RENEWAL", dAr: "تجديد", photos: []
  },
  // 10. AZ TV Plus renewal: no faces
  "renew-plus": {
    plus: true, renew: true, bg: PLUS, title: "تجديد اشتراك بلس", dEn: "RENEWAL", dAr: "تجديد البلس", photos: []
  }
};
const c = CARDS[new URLSearchParams(location.search).get("card") || "aztv-3m"];
const card = document.getElementById("card");
card.classList.toggle("plus", !!c.plus);
card.classList.toggle("is-renew", !!c.renew);
if (c.titleSize) document.getElementById("title").style.fontSize = c.titleSize + "px";
const SCREENS = `<svg class="ico" viewBox="0 0 30 20" aria-hidden="true"><rect x="1.2" y="1.2" width="17" height="11.5" rx="2"/><rect x="11.8" y="6.3" width="17" height="11.5" rx="2"/></svg>`;
if (c.badge) document.getElementById("badge").innerHTML = `<span>${SCREENS}${c.badge[0]} · <bdi dir="ltr">${c.badge[1]}</bdi></span>`;
// renewal arrows: three arcs going clockwise, each ending in an arrow head
if (c.renew) {
  const R = 66, rad = d => (d - 90) * Math.PI / 180, pt = d => [R * Math.cos(rad(d)), R * Math.sin(rad(d))];
  let arcs = "", heads = "";
  for (let k = 0; k < 3; k++) {
    const a0 = k * 120 + 12, a1 = k * 120 + 92, [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    arcs += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}"/>`;
    // head: triangle pointing along the tangent at the arc end
    const t = rad(a1) + Math.PI / 2, n = rad(a1), [hx, hy] = pt(a1 + 8);
    const p = (dx, dn) => [hx + dx * Math.cos(t) + dn * Math.cos(n), hy + dx * Math.sin(t) + dn * Math.sin(n)].map(v => v.toFixed(1)).join(" ");
    heads += `<polygon points="${p(14, 0)} ${p(-14, 24)} ${p(-14, -24)}"/>`;
  }
  document.getElementById("arrows").innerHTML = arcs;
  document.getElementById("heads").innerHTML = heads;
}
document.getElementById("bg").src = document.getElementById("tabs").src = c.bg;
document.getElementById("title").textContent = c.title;
document.getElementById("sub-name").textContent = c.plus ? "AZ TV PLUS" : "AZ TV";
document.getElementById("sub").textContent = c.renew ? "RENEWAL" : "SUBSCRIPTION";
document.getElementById("d-en").textContent = c.dEn;
document.getElementById("d-ar").textContent = c.dAr;
// SVG gamma filter (one per value), for CSS filter: url(#id)
function gammaFilter(g) {
  const id = "gamma" + String(g).replace(".", "");
  if (!document.getElementById(id)) {
    const fn = ["R", "G", "B"].map(ch => `<feFunc${ch} type="gamma" amplitude="1" exponent="${g}" offset="0"/>`).join("");
    document.body.insertAdjacentHTML("beforeend",
      // also trims 1px off the cut-out edge, where lifting the shadows would show a light fringe
      `<svg width="0" height="0" style="position:absolute"><filter id="${id}" color-interpolation-filters="sRGB">` +
      `<feComponentTransfer result="lit">${fn}</feComponentTransfer>` +
      `<feMorphology in="SourceAlpha" operator="erode" radius="1" result="edge"/>` +
      `<feComposite in="lit" in2="edge" operator="in"/></filter></svg>`);
  }
  return id;
}
const photos = document.getElementById("photos");
c.photos.forEach(p => {
  const im = new Image(); im.src = p.src;
  im.style.cssText = `left:${p.left}px;top:${p.top}px;width:${p.width}px`;
  // The actor behind should stay solid down to the floor and the pills (a fade that starts high lets the burst show through the body):
  // use fadeBottom: [86-92, 100] for them; the photo must reach y 560 or more, scale it up if it ends higher.
  // fadeTop / fadeRight: the photo is cut flat at that edge (hair touching the frame, shoulders running out of a close-up),
  // so fade that edge too. fadeBottom: [from %, to %] fades out higher than usual (hides a chair or hands).
  if (p.fadeTop || p.fadeRight || p.fadeBottom) {
    const [b0, b1] = p.fadeBottom || [72, 97];
    const masks = [`linear-gradient(to bottom, ${p.fadeTop ? "transparent 0, #000 9%, " : ""}#000 ${b0}%, transparent ${b1}%)`];
    if (p.fadeRight) masks.push("linear-gradient(to left, transparent 0, #000 24%)");
    im.style.webkitMaskImage = im.style.maskImage = masks.join(", ");
    im.style.webkitMaskComposite = "source-in"; im.style.maskComposite = "intersect";
  }
  if (p.lift || p.gamma) {
    const tone = `grayscale(1) contrast(1.15) brightness(${p.lift || 1.02})`;
    im.style.filter = (p.gamma ? `url(#${gammaFilter(p.gamma)}) ` : "") + tone;
  }
  photos.appendChild(im);
});
const logos = document.getElementById("logos");
LOGOS.forEach(([f, w, own]) => { const im = new Image(); im.src = LOGO + f; if (own || f.includes("white")) im.className = "own-white"; im.style.width = w + "px"; logos.appendChild(im); });
Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })))
  .then(() => document.fonts.ready).then(() => document.body.dataset.ready = "1");
</script>
</body>
</html>
