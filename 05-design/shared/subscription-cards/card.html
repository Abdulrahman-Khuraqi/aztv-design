<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Subscription card</title>
<!--
  One subscription card: the card background (bg/) plus its title, two portraits, duration and platform logos.
  Size 380 x 648 here, exported at 2x = 760 x 1296 to new/<card>.png by render-cards.cjs.
  URL: ?card=plus-12m   (cards are defined in CARDS below)
-->
<style>
  @font-face { font-family: "PingARLT"; src: url("../subscription-backgrounds/src/PingARLT-Bold.woff2") format("woff2"); font-weight: 700; }
  :root { --gold: #EACF69; --ink: #0D0D0D; --white: #F4F4F2; }
  html, body { margin: 0; background: transparent; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .card { position: relative; width: 380px; height: 648px; font-family: "PingARLT", system-ui, sans-serif; color: var(--white); overflow: hidden; border-radius: 35px; }
  .card > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .title { position: absolute; left: 40px; top: 46px; width: 300px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .title b { font-size: 31px; line-height: 1.25; font-weight: 700; letter-spacing: 0; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .title small { margin-top: 3px; font-size: 11.5px; letter-spacing: .09em; direction: ltr; color: var(--white); opacity: .92; font-weight: 700; }
  .tier { position: absolute; left: 140px; top: 122px; width: 100px; height: 22px; z-index: 5; display: grid; place-items: center; border-radius: 99px; background: var(--gold); color: var(--ink); font: 700 12px/1 "PingARLT", sans-serif; letter-spacing: .12em; }

  .photos { position: absolute; left: 18px; top: 100px; width: 344px; height: 440px; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 76%, transparent 100%), linear-gradient(to right, transparent 0, #000 22px);
    -webkit-mask-composite: source-in; mask-image: linear-gradient(to bottom, #000 76%, transparent 100%), linear-gradient(to right, transparent 0, #000 22px); mask-composite: intersect; }
  .photos img { position: absolute; height: auto; filter: grayscale(1) sepia(.28) contrast(1.06) brightness(1.02); }

  .duration { position: absolute; left: 80px; top: 528px; width: 220px; height: 32px; display: flex; gap: 8px; justify-content: center; }
  .duration span { flex: 1; display: grid; place-items: center; border-radius: 99px; font-weight: 700; font-size: 14px; letter-spacing: .06em; }
  .duration .en { background: rgba(13,13,13,.9); border: 1px solid rgba(234,207,105,.55); color: var(--white); direction: ltr; }
  .duration .ar { background: var(--gold); color: var(--ink); font-size: 16px; letter-spacing: 0; }

  .logos { position: absolute; left: 40px; top: 568px; width: 300px; height: 50px; border-radius: 99px; background: var(--ink); display: flex; align-items: center; justify-content: space-evenly; padding: 0 16px; box-sizing: border-box; direction: ltr; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .logos img { display: block; width: auto; filter: brightness(0) invert(1); }
  .logos img.own-white { filter: none; }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="bg" id="bg" alt="">
  <div class="title"><b id="t-ar"></b><small id="t-en"></small></div>
  <div class="tier" id="tier"></div>
  <div class="photos" id="photos"></div>
  <div class="duration"><span class="en" id="d-en"></span><span class="ar" id="d-ar"></span></div>
  <div class="logos" id="logos"></div>
</div>
<script>
const LOGO = "../../new-design/assets/img/logos/";
const CARDS = {
  // Plus, 1 year. Portraits are stand-ins until the name list is matched to the photos.
  "plus-12m": {
    bg: "bg/card-bg-aztv-plus.png", tier: "PLUS",
    ar: "اشتراك بلس سنة", en: "PLUS SUBSCRIPTION FOR 1 YEAR", dEn: "1 YEAR", dAr: "سنة",
    // left portrait sits behind the right one; x, width in card px (left is the card's left edge of the photo area)
    photos: [
      { src: "photos/transparent/008-man-long-hair-dark-coat-chair.png", left: -215, width: 430, top: 52 },
      { src: "photos/transparent/006-yellow-navy-kit-captain.png", left: 62, width: 300, top: 76 }
    ],
    logos: [["netflix.svg", 66], ["ssc.svg", 46], ["bein-white.svg", 58], ["shahid.svg", 52]]
  }
};
const c = CARDS[new URLSearchParams(location.search).get("card") || "plus-12m"];
document.getElementById("bg").src = c.bg;
document.getElementById("t-ar").textContent = c.ar;
document.getElementById("t-en").textContent = c.en;
document.getElementById("tier").textContent = c.tier;
document.getElementById("d-en").textContent = c.dEn;
document.getElementById("d-ar").textContent = c.dAr;
const photos = document.getElementById("photos");
c.photos.forEach((p, i) => {
  const im = new Image(); im.src = p.src; im.style.cssText = `left:${p.left}px;width:${p.width}px;top:${p.top}px;z-index:${i + 1}`;
  photos.appendChild(im);
});
const logos = document.getElementById("logos");
c.logos.forEach(([f, w]) => { const im = new Image(); im.src = LOGO + f; if (f.includes('white')) im.className = 'own-white'; im.style.width = w + "px"; logos.appendChild(im); });
Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })))
  .then(() => document.fonts.ready).then(() => document.body.dataset.ready = "1");
</script>
</body>
</html>
